name: Offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python run.py evaluate --output /tmp/offline.json
      - run: python run.py security --output /tmp/security.json
      - run: python -c "import json; r=json.load(open('/tmp/security.json')); assert all(s['execution_errors']==0 for s in r['summary']); assert all(s['application_success_rate_lower_bound'] is None for s in r['summary']); assert r['case_count']==28"
      - run: docker build -t grounded-rag .
      - run: docker run --rm grounded-rag evaluate --output /tmp/evaluation.json
      - run: docker run --rm grounded-rag security --output /tmp/security.json
